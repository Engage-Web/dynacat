name: Release DynaCat to WordPress.org

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build clean WordPress.org package
        run: |
          mkdir -p build/dynacat
          rsync -av ./ build/dynacat/ \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=tests \
            --exclude=test-results \
            --exclude=playwright-report \
            --exclude=package.json \
            --exclude=package-lock.json \
            --exclude=playwright.config.js \
            --exclude=AGENTS.md \
            --exclude=build

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/dynacat
          ignore-codes: outdated_tested_upto_header

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: dynacat
