name: Auto Repair WordPress Plugin

on:
  workflow_run:
    workflows:
      - Test WordPress Plugin
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  repair:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    outputs:
      has_patch: ${{ steps.patch.outputs.has_patch }}
      attempt: ${{ steps.attempt.outputs.attempt }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine repair attempt
        id: attempt
        shell: bash
        run: |
          message="$(git log -1 --pretty=%B)"
          previous=0
          if [[ "$message" =~ \[codex-repair\ ([0-9]+)/3\] ]]; then
            previous="${BASH_REMATCH[1]}"
          fi
          attempt=$((previous + 1))
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          if (( attempt > 3 )); then
            echo "can_repair=false" >> "$GITHUB_OUTPUT"
            echo "Repair limit reached."
          else
            echo "can_repair=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect failed workflow logs
        if: steps.attempt.outputs.can_repair == 'true' && env.OPENAI_API_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run view "$RUN_ID" --log > repair-context.txt

      - name: Run Codex repair
        if: steps.attempt.outputs.can_repair == 'true' && env.OPENAI_API_KEY != ''
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          allow-bots: true
          allow-bot-users: github-actions[bot]
          prompt: |
            Read and follow AGENTS.md.

            The latest automated WordPress plugin test failed. The complete GitHub Actions
            logs are in repair-context.txt.

            Diagnose the legitimate failure and make the smallest safe changes needed to
            fix it. Preserve plugin behaviour and backwards compatibility. Do not change
            the plugin version, Stable tag, Tested up to value, release tags, deployment
            workflows, SVN credentials, or repository secrets.

            Fix plugin code or test code as appropriate. Do not disable legitimate checks
            merely to make CI green. Do not deploy anything.

            This is automated repair attempt ${{ steps.attempt.outputs.attempt }} of 3.

      - name: Create repair patch
        id: patch
        if: steps.attempt.outputs.can_repair == 'true' && env.OPENAI_API_KEY != ''
        shell: bash
        run: |
          rm -f repair-context.txt
          git add -N .
          git diff --binary > codex-repair.patch
          if [[ -s codex-repair.patch ]]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload repair patch
        if: steps.patch.outputs.has_patch == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: codex-repair
          path: codex-repair.patch

      - name: Codex key not configured
        if: env.OPENAI_API_KEY == ''
        run: |
          echo "::warning::OPENAI_API_KEY is not configured, so automatic repair is disabled."

  validate-and-push:
    needs: repair
    if: needs.repair.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: codex-repair

      - name: Apply Codex repair
        run: git apply codex-repair.patch

      - name: Build production plugin
        run: |
          mkdir -p build/dynacat
          rsync -av ./ build/dynacat/ \
            --exclude-from=.distignore

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/dynacat
          ignore-codes: outdated_tested_upto_header

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start latest stable WordPress
        run: npm run env:start

      - name: Run functional test
        run: npm run test:e2e

      - name: Stop WordPress
        if: always()
        run: npm run env:stop

      - name: Commit and push verified repair
        env:
          ATTEMPT: ${{ needs.repair.outputs.attempt }}
        run: |
          rm -f codex-repair.patch
          git add -A
          git config user.name "Engage Web Plugin Bot"
          git config user.email "plugins@engageweb.co.uk"
          git commit -m "[codex-repair ${ATTEMPT}/3] Automated WordPress compatibility repair"
          git push origin HEAD:main
