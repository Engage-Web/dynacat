name: Engage Web Plugin Maintenance
# ## What It Does
#
# The **Engage Web Plugin Maintenance** workflow is a manual release workflow for DynaCat. It only runs the release job when it is started from the `main` branch and **Confirm release** is enabled. It has write permission because it commits release metadata and creates a Git tag. Concurrent releases are serialized rather than cancelled.
#
# ## Before Running It
#
# 1. Make sure all intended release changes have already been reviewed and merged into `main`.
# 2. Make sure the release is ready to be published; this workflow does not create a review pull request.
# 3. Choose a new version containing two or three numeric components, such as `1.34` or `1.34.1`.
# 4. Configure the `SVN_USERNAME` and `SVN_PASSWORD` GitHub Actions secrets with credentials that can publish the `dynacat` plugin to WordPress.org. The workflow stops if either secret is missing.
# 5. Ensure GitHub Actions has permission to push commits and tags to `main`, including permission under any branch-protection rules.
#
# ## How to Run It
#
# 1. Open the repository on GitHub.
# 2. Select **Actions**.
# 3. Select **Engage Web Plugin Maintenance**.
# 4. Select **Run workflow**.
# 5. Choose the `main` branch.
# 6. Enter the new version in **New plugin version**, for example `1.34` or `1.34.1`.
# 7. Enable **Test, version, tag, and deploy this release to WordPress.org**.
# 8. Select **Run workflow** and monitor every step until it completes.
#
# Leaving the confirmation option disabled causes the release job to be skipped. Running it from a branch other than `main` also causes the job to be skipped.
#
# ## What Happens During a Release
#
# 1. The workflow checks out the repository and installs Subversion.
# 2. It verifies that the WordPress.org credentials exist, validates the version format, and refuses to continue if the corresponding Git or WordPress.org tag already exists.
# 3. It installs Node.js 24, the locked npm dependencies, and Chromium for Playwright.
# 4. It starts the latest stable WordPress test environment and runs the Playwright test suite. The npm scripts use `wp-env` for WordPress and Playwright for the tests.
# 5. It reads the actual WordPress version used by the test environment and records its major/minor version for the `Tested up to` metadata.
# 6. It stops the WordPress environment even if an earlier test step failed.
# 7. After successful tests, it updates the plugin header version, the readme stable tag, the tested WordPress version, and the changelog. It also rejects a release version that is not newer than the current plugin version.
# 8. It builds a clean distribution in `build/dynacat`, excluding development files listed in `.distignore`, and explicitly checks that `node_modules` is absent.
# 9. It runs the official WordPress Plugin Check action against that distribution.
# 10. It creates an installable `dynacat.zip` and uploads it as a GitHub Actions artifact retained for 14 days.
# 11. It commits the updated `dynacat-plugin.php` and `readme.txt` files directly to `main`, creates an annotated Git tag matching the release version, and atomically pushes the commit and tag.
# 12. It checks out the WordPress.org SVN trunk, removes obsolete files, copies in the clean package, confirms that `node_modules` is absent, commits the new trunk contents, and creates the corresponding WordPress.org SVN tag.
#
# ## Important Operational Notes
#
# - Enabling the confirmation option is a real publication action: it updates `main`, creates a Git tag, and deploys to WordPress.org.
# - Do not run the workflow merely to preview a build or execute tests.
# - Do not reuse a version number. Existing Git and WordPress.org tags cause validation to fail before testing or publication begins.
# - If a step fails before the commit-and-tag step, no release commit or Git tag is pushed.
# - The WordPress.org deployment occurs after the Git commit and tag are pushed. Therefore, if SVN deployment fails, the GitHub release commit and tag may already exist; inspect the failed run and repair the deployment rather than immediately rerunning with the same version.
# - A successful run should finish with both the updated WordPress.org trunk and a WordPress.org tag matching the supplied release version.
# - The workflow does not create a GitHub Release object; it creates and pushes an annotated Git tag.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: New plugin version (for example, 1.34)
        required: true
        type: string
      confirm_release:
        description: Test, version, tag, and deploy this release to WordPress.org
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dynacat-wordpress-org-release
  cancel-in-progress: false

jobs:
  check-and-release:
    name: Check and prepare release
    if: github.ref == 'refs/heads/main' && inputs.confirm_release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6

      - name: Install Subversion
        run: |
          sudo apt-get update
          sudo apt-get install --yes subversion

      - name: Validate new release version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$SVN_USERNAME" || -z "$SVN_PASSWORD" ]]; then
            echo "SVN_USERNAME and SVN_PASSWORD secrets are required." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Release version must contain two or three numeric components." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Git tag ${RELEASE_VERSION} already exists." >&2
            exit 1
          fi
          if svn info "https://plugins.svn.wordpress.org/dynacat/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "WordPress.org tag ${RELEASE_VERSION} already exists." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start latest stable WordPress
        run: npm run env:start

      - name: Run WordPress plugin tests
        run: npm test

      - name: Read tested WordPress version
        id: wordpress
        shell: bash
        run: |
          output="$(npm exec wp-env run cli -- wp core version 2>&1)"
          printf '%s\n' "$output"
          version="$(printf '%s\n' "$output" | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | tail -1)"
          if [[ -z "$version" ]]; then
            echo "Could not determine the tested WordPress version." >&2
            exit 1
          fi
          echo "version=$(cut -d. -f1-2 <<< "$version")" >> "$GITHUB_OUTPUT"

      - name: Stop WordPress
        if: always()
        run: npm run env:stop

      - name: Update release metadata from tested WordPress version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          TESTED_UP_TO: ${{ steps.wordpress.outputs.version }}
        shell: bash
        run: |
          php scripts/prepare-release.php "$RELEASE_VERSION" "$TESTED_UP_TO"
          actual_tested_up_to="$(sed -n 's/^Tested up to: //p' readme.txt)"
          if [[ "$actual_tested_up_to" != "$TESTED_UP_TO" ]]; then
            echo "Expected Tested up to: ${TESTED_UP_TO}; found ${actual_tested_up_to}." >&2
            exit 1
          fi

      - name: Build clean WordPress.org package
        run: |
          rm -rf build/dynacat
          mkdir -p build/dynacat
          rsync -av ./ build/dynacat/ \
            --exclude-from=.distignore
          if find build/dynacat -type d -name node_modules -print -quit | grep -q .; then
            echo "node_modules must not be present in the WordPress.org package." >&2
            exit 1
          fi

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/dynacat

      - name: Create installable plugin ZIP
        run: |
          cd build
          zip -r dynacat.zip dynacat

      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@v6
        with:
          name: dynacat-plugin-${{ github.sha }}
          path: build/dynacat.zip
          if-no-files-found: error
          retention-days: 14

      - name: Commit and tag tested release
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          git config user.name "Engage Web Plugin Bot"
          git config user.email "plugins@engageweb.co.uk"
          git add dynacat-plugin.php readme.txt
          git commit -m "Release DynaCat ${RELEASE_VERSION}"
          git tag -a "$RELEASE_VERSION" -m "DynaCat ${RELEASE_VERSION}"
          git push --atomic origin HEAD:main "refs/tags/${RELEASE_VERSION}"

      - name: Deploy to WordPress.org
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wordpress-svn
          svn checkout https://plugins.svn.wordpress.org/dynacat/trunk wordpress-svn/trunk

          # Remove the previously published dependency tree while it still exists
          # in the working copy. Removing it with rsync first makes Subversion walk
          # thousands of individually missing paths and can leave `svn rm` with a
          # non-zero exit status even after it has scheduled the deletions.
          if svn info wordpress-svn/trunk/node_modules >/dev/null 2>&1; then
            svn rm --force --quiet wordpress-svn/trunk/node_modules
          fi

          rsync -av --delete --exclude=.svn build/dynacat/ wordpress-svn/trunk/

          # Schedule any other obsolete tracked files removed by rsync.
          mapfile -t missing_paths < <(svn status wordpress-svn/trunk | sed -n 's/^!       //p')
          for path in "${missing_paths[@]}"; do
            svn rm --force "$path"
          done
          svn add --force wordpress-svn/trunk

          if find wordpress-svn/trunk -type d -name node_modules -print -quit | grep -q .; then
            echo "node_modules must not be deployed to WordPress.org." >&2
            exit 1
          fi
          if svn info "https://plugins.svn.wordpress.org/dynacat/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "WordPress.org tag ${RELEASE_VERSION} already exists." >&2
            exit 1
          fi
          svn commit wordpress-svn/trunk \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --no-auth-cache \
            -m "Update trunk for ${RELEASE_VERSION}"
          svn copy \
            "https://plugins.svn.wordpress.org/dynacat/trunk" \
            "https://plugins.svn.wordpress.org/dynacat/tags/${RELEASE_VERSION}" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --no-auth-cache \
            -m "Tag ${RELEASE_VERSION}"
