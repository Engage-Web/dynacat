name: Engage Web Plugin Maintenance

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to deploy (blank uses the version already in the plugin)
        required: false
        type: string
      confirm_release:
        description: Test, version, tag, and deploy this release to WordPress.org
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dynacat-wordpress-org-release
  cancel-in-progress: false

jobs:
  current-version:
    name: Show current plugin version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plugin.outputs.version }}
      requested_version: ${{ steps.plugin.outputs.requested_version }}
      release_kind: ${{ steps.plugin.outputs.release_kind }}
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Read current plugin version
        id: plugin
        shell: bash
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^ \* Version: \([^[:space:]]*\).*$/\1/p' dynacat-plugin.php | head -1)"
          if [[ -z "$version" ]]; then
            echo 'Could not read the Version header from dynacat-plugin.php.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          requested_version="${REQUESTED_VERSION:-$version}"
          echo "requested_version=$requested_version" >> "$GITHUB_OUTPUT"
          {
            echo '## DynaCat release versions'
            echo
            echo "Current reviewed version: **$version**"
            if [[ -n "$REQUESTED_VERSION" ]]; then
              echo "Requested release version: **$requested_version**"
            elif [[ "$CONFIRM_RELEASE" == 'true' ]]; then
              echo "Version to deploy: **$requested_version** (from the plugin header)"
            else
              echo 'No release version was requested; this is a preview only.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$CONFIRM_RELEASE" != 'true' ]]; then
            exit 0
          fi
          if [[ ! "$requested_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo '::error title=Invalid release version::Enter a version with two or three numeric components, such as 1.41 or 1.41.1.'
            exit 1
          fi
          comparison="$(php -r 'echo version_compare($argv[1], $argv[2]);' "$requested_version" "$version")"
          if [[ "$comparison" == '-1' ]]; then
            echo "::error title=Release version is older::Requested ${requested_version}, but the plugin is already ${version}."
            exit 1
          fi
          if [[ "$comparison" == '0' ]]; then
            echo 'release_kind=existing' >> "$GITHUB_OUTPUT"
            echo 'The existing, already-versioned plugin will be deployed without another version bump.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'release_kind=new' >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Check and prepare release
    needs: current-version
    if: github.ref == 'refs/heads/main' && inputs.confirm_release && needs.current-version.outputs.release_kind == 'new'
    uses: Engage-Web/github-actions/.github/workflows/wordpress-plugin-release.yml@main
    with:
      plugin_slug: dynacat
      plugin_file: dynacat-plugin.php
      plugin_name: DynaCat
      release_version: ${{ needs.current-version.outputs.requested_version }}
      profile: dynacat
    # Forward the repository credentials under the exact names declared by the
    # reusable workflow. `inherit` can silently omit secrets when this caller or
    # the reusable workflow is moved across an organisation boundary.
    secrets:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

  deploy-existing:
    name: Deploy already-versioned plugin
    needs: current-version
    if: github.ref == 'refs/heads/main' && inputs.confirm_release && needs.current-version.outputs.release_kind == 'existing'
    runs-on: ubuntu-latest
    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
      VERSION: ${{ needs.current-version.outputs.requested_version }}
      SVN_URL: https://plugins.svn.wordpress.org/dynacat
    steps:
      - name: Checkout reviewed plugin
        uses: actions/checkout@v4

      - name: Install Subversion client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends subversion

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SVN_USERNAME" ]] || { echo '::error title=Missing SVN username::Set the SVN_USERNAME Actions secret.'; exit 1; }
          [[ -n "$SVN_PASSWORD" ]] || { echo '::error title=Missing SVN password::Set the SVN_PASSWORD Actions secret.'; exit 1; }
          stable_tag="$(sed -n 's/^Stable tag: *//p' readme.txt | head -1)"
          [[ "$stable_tag" == "$VERSION" ]] || { echo "::error title=Version mismatch::Plugin version is ${VERSION}, but readme Stable tag is ${stable_tag}."; exit 1; }

      - name: Run PHP syntax checks
        shell: bash
        run: find . -path './node_modules' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start latest stable WordPress
        run: npm run env:start

      - name: Test plugin functionality
        run: npm test

      - name: Stop WordPress
        if: always()
        run: npm run env:stop

      - name: Build clean deployment package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          plugin_slug="$(sed -n 's/^ \* Text Domain: *//p' dynacat-plugin.php | head -1)"
          [[ "$plugin_slug" =~ ^[a-z0-9-]+$ ]] || { echo '::error title=Invalid plugin slug::The plugin Text Domain must be a non-empty WordPress.org slug.'; exit 1; }
          package_dir="build/$plugin_slug"
          mkdir -p "$package_dir"
          rsync -a --delete-excluded --exclude-from=.distignore ./ "$package_dir/"
          test ! -e "$package_dir/node_modules"
          echo "directory=$package_dir" >> "$GITHUB_OUTPUT"

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ${{ steps.package.outputs.directory }}

      - name: Deploy trunk and version tag to WordPress.org
        shell: bash
        run: |
          set -euo pipefail
          auth=(--username "$SVN_USERNAME" --password "$SVN_PASSWORD" --non-interactive --no-auth-cache)
          svn checkout "$SVN_URL/trunk" wordpress-svn/trunk "${auth[@]}"
          rsync -a --delete --exclude=.svn/ "${{ steps.package.outputs.directory }}/" wordpress-svn/trunk/
          (
            cd wordpress-svn/trunk
            svn add --force . --auto-props --parents >/dev/null
            svn status | awk '$1 == "!" { sub(/^! +/, ""); print }' | while IFS= read -r path; do
              svn rm --force "$path"
            done
            if [[ -n "$(svn status)" ]]; then
              if ! svn commit "${auth[@]}" -m "Release DynaCat $VERSION"; then
                echo '::error title=WordPress.org rejected the SVN credentials::The secrets are present, but WordPress.org did not accept them. Replace SVN_USERNAME with the WordPress.org login (not an email address) and SVN_PASSWORD with that account’s SVN password, then retry the same version.'
                exit 1
              fi
            else
              echo 'WordPress.org trunk is already current.'
            fi
          )
          if svn info "$SVN_URL/tags/$VERSION" >/dev/null 2>&1; then
            echo "WordPress.org tag $VERSION already exists; leaving it unchanged."
          else
            if ! svn copy "$SVN_URL/trunk" "$SVN_URL/tags/$VERSION" "${auth[@]}" -m "Tag DynaCat $VERSION"; then
              echo '::error title=WordPress.org rejected the SVN credentials::The secrets are present, but WordPress.org did not accept them. Replace SVN_USERNAME with the WordPress.org login (not an email address) and SVN_PASSWORD with that account’s SVN password, then retry the same version.'
              exit 1
            fi
          fi
