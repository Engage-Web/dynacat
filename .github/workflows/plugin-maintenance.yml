name: Engage Web Plugin Maintenance

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: New version (leave blank with confirmation off to view current)
        required: false
        type: string
      confirm_release:
        description: Test, version, tag, and deploy this release to WordPress.org
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dynacat-wordpress-org-release
  cancel-in-progress: false

jobs:
  current-version:
    name: Show current plugin version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plugin.outputs.version }}
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Read current plugin version
        id: plugin
        shell: bash
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^ \* Version: \([^[:space:]]*\).*$/\1/p' dynacat-plugin.php | head -1)"
          if [[ -z "$version" ]]; then
            echo 'Could not read the Version header from dynacat-plugin.php.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo '## DynaCat release versions'
            echo
            echo "Current reviewed version: **$version**"
            if [[ -n "$REQUESTED_VERSION" ]]; then
              echo "Requested release version: **$REQUESTED_VERSION**"
            else
              echo 'No release version was requested; this is a preview only.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$CONFIRM_RELEASE" != 'true' ]]; then
            exit 0
          fi
          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo '::error title=Invalid release version::Enter a version with two or three numeric components, such as 1.41 or 1.41.1.'
            exit 1
          fi
          if ! php -r 'exit(version_compare($argv[1], $argv[2], ">") ? 0 : 1);' "$REQUESTED_VERSION" "$version"; then
            echo "::error title=Release version must be newer::Requested ${REQUESTED_VERSION}, but the current reviewed version is ${version}. Choose a version greater than ${version}."
            exit 1
          fi

  release:
    name: Check and prepare release
    needs: current-version
    if: github.ref == 'refs/heads/main' && inputs.confirm_release
    uses: Engage-Web/github-actions/.github/workflows/wordpress-plugin-release.yml@main
    with:
      plugin_slug: dynacat
      plugin_file: dynacat-plugin.php
      plugin_name: DynaCat
      release_version: ${{ inputs.release_version }}
      profile: dynacat
    # Forward the repository credentials under the exact names declared by the
    # reusable workflow. `inherit` can silently omit secrets when this caller or
    # the reusable workflow is moved across an organisation boundary.
    secrets:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
