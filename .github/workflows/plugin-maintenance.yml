name: Engage Web Plugin Maintenance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-release:
    name: Check and prepare release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start latest stable WordPress
        run: npm run env:start

      - name: Run WordPress plugin tests
        run: npm test

      - name: Stop WordPress
        if: always()
        run: npm run env:stop

      - name: Build clean WordPress.org package
        run: |
          rm -rf build/dynacat
          mkdir -p build/dynacat
          rsync -av ./ build/dynacat/ \
            --exclude-from=.distignore

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/dynacat

      - name: Deploy to WordPress.org
        if: startsWith(github.ref, 'refs/tags/')
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: dynacat

      - name: Explain skipped deployment
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "WordPress.org deployment is skipped for ${GITHUB_REF}."
          echo "Run this workflow from an approved release tag to deploy."
