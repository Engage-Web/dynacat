name: Test WordPress Plugin

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  plugin-check:
    name: Test against WordPress
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: .
