name: Test WordPress Plugin

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  end-to-end:
    name: End-to-end functional test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start latest stable WordPress
        run: npm run env:start

      - name: Run DynaCat functional test
        run: npm run test:e2e

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Stop WordPress
        if: always()
        run: npm run env:stop

  plugin-check:
    name: Test against WordPress
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build production plugin
        run: |
          mkdir -p build/dynacat
          rsync -av ./ build/dynacat/ \
            --exclude=.git \
            --exclude=.github \
            --exclude=.gitignore \
            --exclude=.distignore \
            --exclude=.wp-env.json \
            --exclude=AGENTS.md \
            --exclude=build

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/dynacat
          ignore-codes: outdated_tested_upto_header
