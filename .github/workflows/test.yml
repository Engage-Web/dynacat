name: Test WordPress Plugin

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  plugin-check:
    name: Test against WordPress
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build production plugin
        run: |
          mkdir -p build/dynacat
          rsync -av ./ build/dynacat/ \
            --exclude=.git \
            --exclude=.github \
            --exclude=.gitignore \
            --exclude=.distignore \
            --exclude=.wp-env.json \
            --exclude=AGENTS.md \
            --exclude=build

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/dynacat
          ignore-codes: outdated_tested_upto_header
